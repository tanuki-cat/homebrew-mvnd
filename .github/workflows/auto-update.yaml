name: Auto-update mvnd formula

# Polls apache/maven-mvnd for new stable releases and opens a PR that bumps
# Formula/mvnd.rb. GitHub Actions cannot subscribe to another repo's releases,
# so a daily schedule (plus manual dispatch) is used.
on:
  schedule:
    - cron: '7 1 * * *'   # daily at 01:07 UTC = 09:07 China time (UTC+8)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine latest stable mvnd version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # /releases/latest excludes pre-releases; the regex further guards
          # against any rc/beta that isn't flagged as a pre-release upstream.
          latest="$(gh api repos/apache/maven-mvnd/releases/latest --jq .tag_name)"
          if [[ ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest release '$latest' is not a stable X.Y.Z version; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(grep -E '^\s*version ' Formula/mvnd.rb | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ "$latest" == "$current" ]]; then
            echo "Already up to date ($current)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $current -> $latest"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update formula
        if: steps.latest.outputs.skip == 'false'
        run: .github/scripts/update-formula.sh "${{ steps.latest.outputs.latest }}"

      - name: Validate formula syntax
        if: steps.latest.outputs.skip == 'false'
        run: ruby -c Formula/mvnd.rb

      - name: Open pull request
        if: steps.latest.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="auto-update/mvnd-${{ steps.latest.outputs.latest }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists; a PR is likely open. Skipping."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Formula/mvnd.rb
          git commit -m "Release ${{ steps.latest.outputs.latest }}"
          git push -u origin "$branch"
          gh pr create \
            --base master \
            --head "$branch" \
            --title "Release ${{ steps.latest.outputs.latest }}" \
            --body "Automated update of \`mvnd\` from ${{ steps.latest.outputs.current }} to ${{ steps.latest.outputs.latest }}.

          - Bumps \`version\`
          - Updates macOS (amd64, aarch64) and Linux (amd64) \`url\` + \`sha256\`
          - Checksums fetched from https://downloads.apache.org/maven/mvnd/${{ steps.latest.outputs.latest }}/

          Please verify the version and checksums before merging."

          # Close superseded auto-update PRs from older versions and delete
          # their remote branches.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"auto-update/mvnd-\")) | select(.headRefName != \"$branch\") | .number" \
          | while read -r num; do
              [ -n "$num" ] || continue
              echo "Closing superseded PR #$num"
              gh pr close "$num" --delete-branch \
                --comment "Superseded by the PR for mvnd ${{ steps.latest.outputs.latest }}."
            done

          # Sweep any leftover auto-update/* branches that have no open PR.
          git ls-remote --heads origin 'auto-update/mvnd-*' \
            | sed 's#.*refs/heads/##' \
            | while read -r b; do
                [ "$b" = "$branch" ] && continue
                echo "Deleting stale branch $b"
                git push origin --delete "$b" || true
              done
